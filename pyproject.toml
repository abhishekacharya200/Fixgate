[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fixgate"
version = "0.1.0"
description = "A GitHub issue agent with guardrails: triage, reproduce in a sandbox, fix, and open a draft PR only after a human approves."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Abhishek Acharya" }]
keywords = ["agent", "llm", "github", "swe-bench", "guardrails", "sandbox"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = [
    "anthropic>=0.49",
    "openai>=1.60",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.20"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
eval = ["swebench>=5.0", "datasets>=2.18"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27", "google-genai>=1.20"]

[project.scripts]
fixgate = "fixgate.cli:main"

[project.urls]
Homepage = "https://github.com/abhishekacharya200/fixgate"

[tool.hatch.build.targets.wheel]
packages = ["src/fixgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a working Docker daemon (skipped when Docker is not available)",
]
